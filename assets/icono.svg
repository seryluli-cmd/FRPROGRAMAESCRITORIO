<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Ícono de FRKiosko: el carrito (maqueta C, elegida por el dueño el 2026-10-28).
       icono.png e icono.ico salen de este archivo con assets/armar_icono.py. -->
  <rect x="12" y="12" width="232" height="232" rx="50" fill="#2F6FED"/>
  <!-- Los dos productos adentro del carrito. -->
  <rect x="104" y="78" width="34" height="40" rx="5" fill="#FBBF24"/>
  <rect x="144" y="64" width="30" height="54" rx="5" fill="#5DCAA5"/>
